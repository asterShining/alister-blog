name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-build:
    name: ci-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Astro and TypeScript
        run: pnpm exec astro check

      - name: Build site
        run: pnpm build

      - name: Share production build with E2E jobs
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 7

  e2e-smoke:
    name: e2e-smoke
    needs: ci-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist/

      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps chromium --only-shell

      - name: Run smoke E2E against local preview
        run: pnpm test:e2e:smoke

  e2e-production:
    name: e2e-production
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    needs: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist/

      - name: Verify production metadata against local preview
        run: pnpm test:e2e:production
